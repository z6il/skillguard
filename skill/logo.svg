<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="inner">
      <path d="M256 118 L370 160 V246 C370 318 322 366 256 392 C190 366 142 318 142 246 V160 Z"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#0b0b12"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- the shield -->
  <path d="M256 70 L410 126 V246 C410 344 344 410 256 444 C168 410 102 344 102 246 V126 Z"
        fill="#ff2e4d" fill-opacity="0.07" stroke="#ff2e4d" stroke-width="26" stroke-linejoin="round"/>

  <!-- a page of skill text inside it; one hidden line is revealed in red -->
  <g clip-path="url(#inner)">
    <rect x="186" y="178" width="140" height="14" rx="7" fill="#f4f4f5" fill-opacity="0.85"/>
    <rect x="186" y="214" width="104" height="14" rx="7" fill="#f4f4f5" fill-opacity="0.85"/>
    <rect x="186" y="250" width="124" height="14" rx="7" fill="#ff2e4d"/>
    <rect x="186" y="286" width="86" height="14" rx="7" fill="#f4f4f5" fill-opacity="0.85"/>
  </g>
  <!-- the scan line passing over the revealed line -->
  <rect x="150" y="255" width="212" height="4" rx="2" fill="#ff2e4d" fill-opacity="0.55"/>
</svg>
