# skillguard pattern rules.
#
# Each rule is a line-based regular expression (Go RE2 syntax).
#   kinds:   which files it applies to: text (Markdown, rules files), code (scripts), config (JSON/YAML/TOML).
#            Leave it out to apply to every file.
#   exclude: a match is dropped when this pattern also matches it.
#   skip_line: the rule is skipped on lines that match this pattern.
#   skip_quoted: a match right after a quote mark is treated as a citation, not an instruction.
#   skip_comments: comment lines in code are ignored (for rules about what code does).
#   skip_negated: matches after "never", "don't", "avoid" and similar in the same clause are ignored.
#   secret:  redact the match in output and skip obvious placeholders.
#
# Add your own with `skillguard scan --rules my-rules.yaml`.

rules:
  # ── Prompt injection ──────────────────────────────────────────────
  - id: SG001
    title: Instruction override
    severity: high
    skip_negated: true
    ignore_case: true
    skip_quoted: true
    pattern: |-
      \b(ignore|disregard|forget|override)\s+(all\s+|any\s+|the\s+|your\s+)?(previous|prior|above|earlier|preceding|system|original)\s+(instructions|rules|prompts?|messages|guidelines|directives)
    reason: Tries to make the agent drop its existing instructions. Classic prompt injection.

  - id: SG006
    title: Hides actions from the user
    severity: medium
    kinds: [text, config]
    ignore_case: true
    skip_quoted: true
    pattern: |-
      \bwithout\s+(telling|asking|informing|notifying|alerting)\s+(the\s+)?user\b|\b(do\s+not|don't|never)\s+(tell|inform|notify|alert)\s+(the\s+)?user\b(\s+(to|they|that|how|what|why|which)\b)?|\bkeep\s+(this|it)\s+(secret|hidden)\s+from\s+(the\s+)?user\b|\bsilently\s+(run|execute|send|upload|install|download|post)\b
    exclude: |-
      \s(to|they|that|how|what|why|which)$
    reason: Asks the agent to act without the user knowing.

  - id: SG007
    title: System prompt extraction
    severity: high
    skip_negated: true
    ignore_case: true
    skip_quoted: true
    pattern: |-
      \b(reveal|print|output|repeat|send|leak|dump)\s+(your|the)\s+(full\s+)?(system\s+prompt|hidden\s+instructions|initial\s+instructions)
    reason: Asks the agent to disclose its system prompt or hidden instructions.

  # ── Remote code execution ─────────────────────────────────────────
  - id: SG010
    title: Remote script piped to a shell
    severity: high
    skip_comments: true
    skip_negated: true
    ignore_case: true
    pattern: |-
      \b(curl|wget|iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\s+[^|\n]*[^|\s][^|\n]*\|\s*(sudo\s+)?(sh|bash|zsh|dash|python3?|node|iex|Invoke-Expression)\b
    exclude: |-
      ^\w+\s+(\.\.\.|…|<[^>]*>)\s*\|
    reason: Downloads code and runs it immediately. Whoever controls that URL controls your machine.

  - id: SG018
    title: Obfuscated execution
    severity: high
    skip_comments: true
    skip_negated: true
    ignore_case: true
    pattern: |-
      eval\s*\(\s*(atob|Buffer\.from|unescape|String\.fromCharCode)|exec\s*\(\s*(base64\.b64decode|codecs\.decode|zlib\.decompress|marshal\.loads)|base64\s+(-d|--decode)\b[^\n]*\|\s*(sh|bash|python3?)\b|FromBase64String|powershell[^\n]*\s-(e|ec|enc|encodedcommand)\s
    reason: Decodes hidden code and runs it. Legit tools rarely need to hide what they execute.

  - id: SG023
    title: Reverse shell
    severity: critical
    skip_comments: true
    skip_negated: true
    pattern: |-
      /dev/tcp/|\bnc(at)?\s+[^\n]*\s-(e|c)\s|\bncat\s[^\n]*--exec|bash\s+-i\s*>&|socat\s[^\n]*exec:|System\.Net\.Sockets\.TCPClient
    reason: Opens a shell that a remote machine can control.

  # ── Credentials and data theft ────────────────────────────────────
  - id: SG011
    title: Reads credential files
    severity: high
    skip_comments: true
    skip_negated: true
    pattern: |-
      \.ssh[/\\]\w|\.aws[/\\]credentials|\.config[/\\]gcloud[/\\]|\.kube[/\\]config|\.docker[/\\]config\.json|\.azure[/\\](accessTokens|msal_token_cache)
    reason: Touches SSH keys or cloud credentials. An agent add-on almost never needs these.

  - id: SG025
    title: Mentions key or credential files
    severity: medium
    skip_comments: true
    skip_negated: true
    pattern: |-
      \bid_(rsa|dsa|ed25519|ecdsa)\b|\.git-credentials\b|\.dockercfg\b
    reason: Names files that hold private keys or saved credentials. Fine in a deny list, suspicious in anything that reads files.

  - id: SG012
    title: Reads token files
    severity: medium
    skip_line: |-
      \b(deny|block|reject|forbid)\w*\b
    skip_comments: true
    skip_negated: true
    pattern: |-
      (^|[\s;|&(`'"=])(cat|less|more|head|tail|type|Get-Content|gc|source)\s+([^\n|;&]*?['"\s/\\~])?\.(env|netrc|npmrc|pypirc)\b|\b(readFileSync|readFile|read_text|open|fopen|load_dotenv|Get-Content)\s*\([^)\n]*\.(env|netrc|npmrc|pypirc)\b
    reason: Reads files that usually hold API tokens.

  - id: SG013
    title: Reads browser or wallet data
    severity: high
    skip_comments: true
    skip_negated: true
    pattern: |-
      (Chrome|Chromium|Brave-Browser|Edge|Opera)[/\\ ]+(User Data|Default)\b|\bLogin Data\b|\bLocal State\b|\.mozilla[/\\]firefox|\bkey[34]\.db\b|\blogins\.json\b|\bcookies\.sqlite\b|\bwallet\.dat\b|Local Extension Settings
    reason: Touches saved passwords, cookies or crypto wallets.

  - id: SG014
    title: Dumps environment variables
    severity: medium
    skip_comments: true
    skip_negated: true
    pattern: |-
      \bprintenv\b|\benv\s*\|\s*(curl|nc|base64)|JSON\.stringify\(\s*process\.env\s*\)|json\.dumps\(\s*(dict\(\s*)?os\.environ\b|\b(Get-ChildItem|gci|dir)\s+env:
    reason: Environment variables often contain API keys.

  # ── Network ───────────────────────────────────────────────────────
  - id: SG015
    title: Sends data to a capture service
    severity: high
    skip_comments: true
    skip_negated: true
    ignore_case: true
    pattern: |-
      webhook\.site|pipedream\.net|requestbin|interact\.sh|\boast\.(fun|pro|live|site|online|me)\b|burpcollaborator\.net|ngrok(-free)?\.(io|app)|trycloudflare\.com|pastebin\.com|transfer\.sh|\b0x0\.st\b|\bfile\.io\b
    reason: These services are commonly used to collect stolen data or tunnel out of a network.

  - id: SG016
    title: Posts to a chat webhook or bot
    severity: medium
    skip_comments: true
    skip_negated: true
    ignore_case: true
    pattern: |-
      discord(app)?\.com/api/webhooks/|api\.telegram\.org/bot|hooks\.slack\.com/services/
    reason: Can be a normal integration, or a simple way to send data out. Check what is sent.

  - id: SG017
    title: Connects to a raw IP address
    severity: medium
    skip_comments: true
    skip_negated: true
    pattern: |-
      https?://(\d{1,3}\.){3}\d{1,3}
    exclude: |-
      https?://(127\.|0\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.|192\.0\.2\.|198\.51\.100\.|203\.0\.113\.|22[4-9]\.|2[3-5]\d\.)
    reason: Real services use domain names. A hard-coded public IP is a common sign of a throwaway server.

  # ── System changes ────────────────────────────────────────────────
  - id: SG019
    title: Destructive command
    severity: high
    skip_comments: true
    skip_negated: true
    pattern: |-
      \brm\s+-[a-zA-Z]*[rR][a-zA-Z]*\s+(--no-preserve-root\s+)?(/|~|\$HOME|/\*)(\s|$|"|')|\bmkfs\.|\bdd\s+if=[^\n]*of=/dev/(sd|nvme|disk)|\bformat\s+[a-zA-Z]:\s*/
    skip_line: |-
      \becho\s+['"]|\b(deny|block|reject|forbid|dangerous)\w*\b
    reason: Can wipe a home directory or disk.

  - id: SG020
    title: Persistence
    severity: medium
    skip_comments: true
    skip_negated: true
    pattern: |-
      \|\s*crontab\b|>>\s*(~/|\$HOME/)?\.(bashrc|zshrc|bash_profile|profile|zprofile)\b|launchctl\s+(load|bootstrap)|schtasks\s+/create|CurrentVersion\\Run\b|systemctl\s+(--user\s+)?enable
    reason: Makes something start automatically, so it keeps running after the agent session ends.

  - id: SG021
    title: Turns off agent approvals
    severity: medium
    skip_quoted: true
    pattern: |-
      --dangerously-skip-permissions|"defaultMode"\s*:\s*"bypassPermissions"|\bdefaultMode\s*[:=]\s*bypassPermissions|--yolo\b|--full-auto\b|approval_policy\s*=\s*"?never|sandbox_mode\s*=\s*"?danger-full-access
    reason: Lets the agent run commands without asking you first.

  - id: SG024
    title: Disables OS security
    severity: high
    skip_comments: true
    skip_negated: true
    pattern: |-
      Set-MpPreference\s+-Disable|Add-MpPreference\s+-ExclusionPath|\bcsrutil\s+disable|\bsetenforce\s+0|spctl\s+--master-disable
    reason: Turns off antivirus or OS protection.

  # ── Hard-coded secrets ────────────────────────────────────────────
  - id: SG030
    title: Hard-coded secret
    severity: high
    secret: true
    pattern: |-
      \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{60,}|\bsk-ant-[A-Za-z0-9_-]{20,}|\bsk-(proj-)?[A-Za-z0-9_-]{32,}|\bAKIA[0-9A-Z]{16}\b|\bxox[abprs]-[A-Za-z0-9-]{10,}|\bAIza[0-9A-Za-z_-]{35}\b|\b\d{8,10}:AA[A-Za-z0-9_-]{33}\b|\b(sk|rk)_live_[A-Za-z0-9]{20,}
    reason: A real-looking API token is stored in the file. Anyone who installs this gets it.

  - id: SG031
    title: Private key
    severity: critical
    secret: true
    pattern: |-
      -----BEGIN (RSA |EC |OPENSSH |DSA |PGP |ENCRYPTED )?PRIVATE KEY-----
    reason: A private key is embedded in the file.
